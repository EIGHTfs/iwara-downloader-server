<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<title>iwara-downloader 登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <h1>🌐 iwara-downloader</h1>
  <div class="card">
    <h2>登录</h2>
    <input type="password" id="pwd" placeholder="访问密码">
    <button class="primary" id="btn">登录</button>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
document.getElementById("pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
document.getElementById("btn").addEventListener("click", login);
async function login() {
  const st = document.getElementById("status");
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pwd").value })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "登录失败");
    location.href = "/";
  } catch (e) {
    st.textContent = e.message;
    st.className = "status err";
  }
}
</script>
</body>
</html>
