<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/iwara-logo.png?v=2">
<title>本地播放 · iwara-downloader</title>
<link rel="stylesheet" href="style.css">
<script>
try {
  const th = localStorage.getItem("gbmd-theme");
  if (th === "night") document.documentElement.setAttribute("data-theme", "night");
} catch (_) {}
</script>
<style>
/* ═══ 播放页布局 ═══ */
/* header 不用 sticky，播放页独占全屏 */
.play-body header { position: static; }
.play-body .player-page {
  display: flex;
  gap: 16px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
  height: calc(100vh - 64px);
  overflow: hidden;
}
.player-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.player-stage {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  flex: 1 1 auto;
  min-height: 360px;
  position: relative;
}
.player-stage #player,
.player-stage .art-video-player,
.player-stage .art-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.player-meta {
  margin-top: 12px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  flex-shrink: 0;
}
.player-meta h1 { margin: 0 0 8px; font-size: 18px; word-break: break-all; }
.player-author { color: var(--muted); margin-bottom: 8px; font-size: 13px; }
.player-author a { color: var(--primary); text-decoration: none; }
.player-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.player-tags span {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 10px; font-size: 12px;
}
.player-extra { color: var(--muted); font-size: 12px; }
.player-err { color: var(--fail); margin-top: 8px; font-size: 13px; }
/* 右侧播放列表 */
.player-sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.sidebar-header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card2);
}
.sidebar-header .count { font-size: 12px; color: var(--muted); font-weight: normal; }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.playlist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background .15s; margin-bottom: 4px;
}
.playlist-item:hover { background: var(--card2); }
.playlist-item.active {
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  outline: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
}
.playlist-item .thumb {
  width: 80px; height: 45px; object-fit: cover;
  border-radius: 4px; background: var(--border); flex-shrink: 0;
}
.playlist-item .info { flex: 1; min-width: 0; }
.playlist-item .title {
  font-size: 13px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; color: var(--text);
}
.playlist-item.active .title { color: var(--primary); }
.playlist-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sidebar-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.loading-more {
  padding: 12px; text-align: center; color: var(--muted);
  font-size: 12px; border-top: 1px solid var(--border); cursor: pointer;
}
.loading-more:hover { color: var(--primary); }
@media (max-width: 900px) {
  .play-body .player-page { flex-direction: column; height: auto; overflow: auto; }
  .player-stage { min-height: 250px; height: 56vw; position: relative; }
  .player-sidebar { width: 100%; max-height: 320px; }
}
</style>
</head>
<body class="play-body">
<!-- ═══ 顶部导航栏（播放页不 sticky） ═══ -->
<header>
  <div class="brand-block">
    <a href="/" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <img src="iwara-logo.png" alt="Iwara" class="brand-logo">
      <h1 class="brand-title">Iwara<br>Video<br>Downloader</h1>
    </a>
  </div>
  <div class="right">
    <a class="ghost" href="/">返回进度</a>
    <button class="ghost" id="themeBtn" type="button" title="切换白天/夜间模式">🌙 夜间</button>
  </div>
</header>

<!-- ═══ 播放页主体 ═══ -->
<div class="player-page">
  <div class="player-main">
    <div class="player-stage"><div id="player"></div></div>
    <div class="player-meta">
      <h1 id="title">加载中…</h1>
      <div class="player-author"><span id="author"></span></div>
      <div class="player-tags" id="tags"></div>
      <div class="player-extra" id="extra"></div>
      <div class="player-err" id="err"></div>
    </div>
  </div>
  <div class="player-sidebar">
    <div class="sidebar-header">
      <span>播放列表</span>
      <span class="count" id="listCount"></span>
    </div>
    <div class="sidebar-list" id="playlist">
      <div class="sidebar-empty">加载中…</div>
    </div>
    <div class="loading-more" id="loadingMore" style="display:none">加载更多</div>
  </div>
</div>

<script src="/vendor/artplayer.js"></script>
<script>
(function () {
  "use strict";
  // ═══ ID：优先 hash #id=xxx，兼容查询 ?id=xxx ═══
  // 用户原话：「视频播放网页第一次必须刷新才能加载视频，而且刷新后地址连接不对 http://sa6400.local:28463/play.html?id=hdEkJU8Ntkuic1#id=3dqVfrNJMgjoYZ」
  // 【原代码】只读 location.hash；无 hash 时取索引第一个并 setIdToHash。
  // 【改为】查询参数也当 id；无 hash 有 ?id= 时改写成 /play.html#id=xxx（去掉 query，避免刷新叠成 ?id=A#id=B）。
  // 【思路】任务列表按钮以前写 ?id=，页面只认 hash → 第一次当「无 id」跳到目录第一条；刷新后 hash 才有值，看起来像必须刷新。
  function getIdFromHash() {
    var h = location.hash || "";
    var m = h.match(/[#&]id=([^&]*)/);
    return m ? decodeURIComponent(m[1]).trim() : "";
  }
  function getIdFromQuery() {
    var q = location.search || "";
    var m = q.match(/[?&]id=([^&]*)/);
    return m ? decodeURIComponent(m[1]).trim() : "";
  }
  function setIdToHash(newId) {
    if (newId) location.hash = "#id=" + encodeURIComponent(newId);
    else location.hash = "";
  }
  var id = getIdFromHash() || getIdFromQuery();
  if (id && !getIdFromHash()) {
    var path = location.pathname || "/play.html";
    history.replaceState(null, "", path + "#id=" + encodeURIComponent(id));
  }
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function dur(n) {
    n = Number(n) || 0;
    return Math.floor(n / 60) + ":" + String(Math.floor(n % 60)).padStart(2, "0");
  }
  function themeColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--primary").trim() || "#2563eb";
  }

  // ─── 主题 ───
  function applyThemeBtn() {
    var night = document.documentElement.getAttribute("data-theme") === "night";
    var btn = $("#themeBtn");
    if (btn) btn.textContent = night ? "☀ 白天" : "🌙 夜间";
  }
  applyThemeBtn();
  var themeBtn = $("#themeBtn");
  if (themeBtn) {
    themeBtn.onclick = function () {
      var night = document.documentElement.getAttribute("data-theme") === "night";
      var next = night ? "day" : "night";
      if (next === "night") document.documentElement.setAttribute("data-theme", "night");
      else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem("gbmd-theme", next); } catch (_) {}
      applyThemeBtn();
      if (window.__art) window.__art.theme = themeColor();
    };
  }

  // ─── 无 id → 取列表第一个（仅真的没带 ?id= 也没 #id=）───
  if (!id) {
    fetch("/api/index").then(function (r) { return r.json(); }).then(function (j) {
      var map = (j && j.videos && typeof j.videos === "object") ? j.videos : {};
      var ids = Object.keys(map);
      if (!ids.length) { $("#title").textContent = "没有可播放的视频"; return; }
      ids.sort(function (a, b) {
        return String((map[b] || {}).createdAt || "").localeCompare(String((map[a] || {}).createdAt || ""));
      });
      var path = location.pathname || "/play.html";
      location.replace(path + "#id=" + encodeURIComponent(ids[0]));
    }).catch(function () { $("#title").textContent = "加载列表失败"; });
    return;
  }

  var PAGE_SIZE = 20;
  var art = null;
  var allVideos = [];
  var displayedCount = 0;
  var loadingVideo = false; // 防止并发加载

  // ─── 初始化播放器 ───
  function initPlayer(info, poster) {
    if (!info.hasFile) {
      $("#err").textContent = info.partial
        ? "正在下载中，已写入 0 字节，等几秒再刷新"
        : "没有可播放的视频文件";
      return;
    }
    if (art) { try { art.destroy(false); } catch (_) {} art = null; }
    art = new Artplayer({
      container: "#player",
      url: "/api/play?id=" + encodeURIComponent(id),
      type: (info.ext || "").replace(/^\./, "") || "mp4",
      poster: poster || "",
      theme: themeColor(),
      lang: "zh-cn",
      volume: 0.7,
      autoplay: true,
      muted: false,
      autoSize: false,
      autoMini: false,
      playbackRate: true,
      aspectRatio: true,
      screenshot: true,
      setting: true,
      hotkey: true,
      pip: true,
      fullscreen: true,
      fullscreenWeb: true,
      miniProgressBar: true,
      playsInline: true,
      mutex: true,
      moreVideoAttr: { playsInline: true }
    });
    window.__art = art;
    try {
      if (art.video) { art.video.removeAttribute("crossorigin"); art.video.crossOrigin = null; }
    } catch (_) {}
    art.on("error", function (err) {
      $("#err").textContent = (err && err.message) || "播放失败";
    });
    if (info.partial) {
      $("#err").textContent = "边下边播：进度条只到已写入部分，拖到后面会回到已缓存处。下完刷新看全片。";
      art.on("video:seeking", function () {
        var v = art.video;
        if (!v || !isFinite(v.duration) || v.duration <= 0) return;
        if (v.currentTime > v.duration - 0.25) v.currentTime = Math.max(0, v.duration - 0.5);
      });
    }
  }

  // ─── 播放列表 ───
  function catalogVideos(j) {
    var map = (j && j.videos && typeof j.videos === "object") ? j.videos : {};
    return Object.keys(map).map(function (vid) {
      var e = map[vid] || {};
      return { id: vid, title: e.title || vid, name: e.name || e.username || "", duration: e.duration || 0, fileId: e.fileId || "", createdAt: e.createdAt || "" };
    }).sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
  }

  // 封面 URL 加时间戳防缓存：播放后刷新封面
  function thumbUrl(vid) {
    return "/api/thumb?id=" + encodeURIComponent(vid) + "&t=" + Date.now();
  }

  function renderPlaylist(clear) {
    var container = $("#playlist");
    var countEl = $("#listCount");
    var loadingEl = $("#loadingMore");
    if (clear) { container.innerHTML = ""; displayedCount = 0; }
    if (!allVideos.length) {
      container.innerHTML = '<div class="sidebar-empty">索引里还没有其它视频</div>';
      countEl.textContent = "";
      loadingEl.style.display = "none";
      return;
    }
    var start = displayedCount;
    var end = Math.min(start + PAGE_SIZE, allVideos.length);
    for (var i = start; i < end; i++) {
      var v = allVideos[i];
      var item = document.createElement("div");
      item.className = "playlist-item" + (v.id === id ? " active" : "");
      // 首次加载用普通 URL（浏览器缓存），切换视频后用时间戳刷新
      var src = v.id ? "/api/thumb?id=" + encodeURIComponent(v.id) : "";
      item.innerHTML =
        (src ? '<img class="thumb" data-vid="' + esc(v.id) + '" src="' + esc(src) + '" alt="" loading="lazy" onerror="this.dataset.miss=1" onload="this.style.visibility=\'visible\';this.dataset.miss=\'\'">' : '<div class="thumb"></div>') +
        '<div class="info">' +
          '<div class="title" title="' + esc(v.title) + '">' + esc(v.title) + '</div>' +
          '<div class="meta">' + esc(v.name) + (v.duration ? " · " + dur(v.duration) : "") + '</div>' +
        '</div>';
      item.onclick = (function (vid) {
        return function () { if (vid !== id) setIdToHash(vid); };
      })(v.id);
      container.appendChild(item);
    }
    displayedCount = end;
    countEl.textContent = allVideos.length + " 个";
    if (end < allVideos.length) {
      loadingEl.style.display = "block";
      loadingEl.textContent = "加载更多（还剩 " + (allVideos.length - end) + "）";
    } else {
      loadingEl.style.display = "none";
    }
  }

  // 刷新当前视频的封面缩略图（列表里的 + poster）
  function refreshCurrentThumb() {
    // 2026-09-04：换 src 前清 hidden。用户原话「前端正常刷新封面了，刷新又没了」。
    // 【原代码】onerror 设 visibility=hidden，refreshCurrentThumb 只改 src，hidden 不恢复。
    // 【思路】第一次 404/304 空图把图藏死后，即使后面 JPEG 200 也看不见。
    var ts = Date.now();
    var activeImg = document.querySelector(".playlist-item.active .thumb[data-vid]");
    if (activeImg) {
      activeImg.style.visibility = "visible";
      activeImg.src = "/api/thumb?id=" + encodeURIComponent(id) + "&t=" + ts;
    }
    if (art) art.poster = "/api/thumb?id=" + encodeURIComponent(id) + "&t=" + ts;
  }

  function bindLazyLoad() {
    var list = $("#playlist");
    var more = $("#loadingMore");
    more.onclick = function () { renderPlaylist(false); };
    list.addEventListener("scroll", function () {
      if (displayedCount >= allVideos.length) return;
      if (list.scrollTop + list.clientHeight >= list.scrollHeight - 40) renderPlaylist(false);
    });
  }

  // ─── 加载视频（play-info + 更新播放器） ───
  function loadVideo(newId) {
    if (!newId || loadingVideo) return;
    loadingVideo = true;
    id = newId;
    // 清空旧状态
    $("#title").textContent = "加载中…";
    $("#author").textContent = "";
    $("#tags").innerHTML = "";
    $("#extra").textContent = "";
    $("#err").textContent = "";
    // 更新 active 状态
    var items = document.querySelectorAll(".playlist-item");
    for (var i = 0; i < items.length; i++) {
      var img = items[i].querySelector(".thumb[data-vid]");
      var vid = img ? img.getAttribute("data-vid") : "";
      items[i].className = "playlist-item" + (vid === id ? " active" : "");
    }

    fetch("/api/play-info?id=" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        loadingVideo = false;
        if (!j) return;
        if (!j.ok) throw new Error(j.error || "读取失败");
        document.title = (j.title || id) + " · 本地播放";
        $("#title").textContent = j.title || id;
        $("#author").innerHTML = j.username
          ? '<a href="https://www.iwara.tv/profile/' + encodeURIComponent(j.username) + '" target="_blank" rel="noopener">' + esc(j.name || j.username) + '</a>'
          : esc(j.name || "");
        var tags = Array.isArray(j.tags) ? j.tags : [];
        $("#tags").innerHTML = tags.map(function (t) { return "<span>" + esc(t.id || t) + "</span>"; }).join("");
        var extra = [];
        if (j.duration) extra.push("时长 " + dur(j.duration));
        if (j.createdAt) extra.push("上传 " + String(j.createdAt).slice(0, 10));
        extra.push("id " + id);
        $("#extra").textContent = extra.join(" · ");
        initPlayer(j, thumbUrl(id));
        // play-info 返回后刷新封面（服务端 ensureFromInfo 可能刚抽帧）
        setTimeout(refreshCurrentThumb, 500);
        setTimeout(refreshCurrentThumb, 2000);
      })
      .catch(function (e) {
        loadingVideo = false;
        $("#title").textContent = "无法播放";
        $("#err").textContent = e.message || String(e);
      });
  }

  // ─── hashchange 监听：切换视频不刷新页面 ───
  window.addEventListener("hashchange", function () {
    var newId = getIdFromHash();
    if (newId && newId !== id) loadVideo(newId);
  });

  // ─── 首次加载 ───
  // 并行加载 play-info 和 index
  var playInfoDone = false;
  var indexDone = false;
  function tryInit() {
    if (playInfoDone && indexDone) bindLazyLoad();
  }

  fetch("/api/play-info?id=" + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j) return;
      if (!j.ok) throw new Error(j.error || "读取失败");
      document.title = (j.title || id) + " · 本地播放";
      $("#title").textContent = j.title || id;
      $("#author").innerHTML = j.username
        ? '<a href="https://www.iwara.tv/profile/' + encodeURIComponent(j.username) + '" target="_blank" rel="noopener">' + esc(j.name || j.username) + '</a>'
        : esc(j.name || "");
      var tags = Array.isArray(j.tags) ? j.tags : [];
      $("#tags").innerHTML = tags.map(function (t) { return "<span>" + esc(t.id || t) + "</span>"; }).join("");
      var extra = [];
      if (j.duration) extra.push("时长 " + dur(j.duration));
      if (j.createdAt) extra.push("上传 " + String(j.createdAt).slice(0, 10));
      extra.push("id " + id);
      $("#extra").textContent = extra.join(" · ");
      initPlayer(j, thumbUrl(id));
      setTimeout(refreshCurrentThumb, 500);
      setTimeout(refreshCurrentThumb, 2000);
      playInfoDone = true;
      tryInit();
    })
    .catch(function (e) {
      $("#title").textContent = "无法播放";
      $("#err").textContent = e.message || String(e);
      playInfoDone = true;
      tryInit();
    });

  fetch("/api/index").then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok) return;
    allVideos = catalogVideos(j);
    renderPlaylist(true);
    indexDone = true;
    tryInit();
  }).catch(function () {
    $("#playlist").innerHTML = '<div class="sidebar-empty">播放列表加载失败</div>';
    indexDone = true;
    tryInit();
  });

  window.addEventListener("beforeunload", function () {
    if (art) { try { art.destroy(false); } catch (_) {} }
  });
})();
</script>
</body>
</html>
