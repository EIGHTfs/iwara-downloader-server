<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/iwara-logo.png?v=2">
<title>本地播放 · iwara-downloader</title>
<link rel="stylesheet" href="style.css">
<script>
try {
  const th = localStorage.getItem("gbmd-theme");
  if (th === "night") document.documentElement.setAttribute("data-theme", "night");
} catch (_) {}
</script>
<style>
.player-page {
  display: flex;
  gap: 16px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
  height: calc(100vh - 64px);
  overflow: hidden;
}
.player-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.player-stage {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  flex: 1;
  min-height: 240px;
}
.player-stage .art-video-player { width: 100%; height: 100%; }
.player-meta {
  margin-top: 12px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  flex-shrink: 0;
}
.player-meta h1 { margin: 0 0 8px; font-size: 18px; word-break: break-all; }
.player-author { color: var(--muted); margin-bottom: 8px; font-size: 13px; }
.player-author a { color: var(--primary); text-decoration: none; }
.player-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.player-tags span {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 10px; font-size: 12px;
}
.player-extra { color: var(--muted); font-size: 12px; }
.player-err { color: var(--fail); margin-top: 8px; font-size: 13px; }
.player-sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.sidebar-header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card2);
}
.sidebar-header .count { font-size: 12px; color: var(--muted); font-weight: normal; }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.playlist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background .15s; margin-bottom: 4px;
}
.playlist-item:hover { background: var(--card2); }
.playlist-item.active {
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  outline: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
}
.playlist-item .thumb {
  width: 80px; height: 45px; object-fit: cover;
  border-radius: 4px; background: var(--border); flex-shrink: 0;
}
.playlist-item .info { flex: 1; min-width: 0; }
.playlist-item .title {
  font-size: 13px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; color: var(--text);
}
.playlist-item.active .title { color: var(--primary); }
.playlist-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sidebar-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.loading-more {
  padding: 12px; text-align: center; color: var(--muted);
  font-size: 12px; border-top: 1px solid var(--border); cursor: pointer;
}
.loading-more:hover { color: var(--primary); }
@media (max-width: 900px) {
  .player-page { flex-direction: column; height: auto; overflow: auto; }
  .player-stage { min-height: 250px; height: 56vw; }
  .player-sidebar { width: 100%; max-height: 320px; }
}
</style>
</head>
<body>
<header>
  <div class="brand-block">
    <a href="/" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <img src="iwara-logo.png" alt="Iwara" class="brand-logo">
      <h1 class="brand-title">Iwara<br>Video<br>Downloader</h1>
    </a>
  </div>
  <div class="right">
    <a class="ghost" href="/">返回进度</a>
    <button class="ghost" id="themeBtn" type="button" title="切换白天/夜间模式">🌙 夜间</button>
  </div>
</header>

<div class="player-page">
  <div class="player-main">
    <div class="player-stage"><div id="player"></div></div>
    <div class="player-meta">
      <h1 id="title">加载中…</h1>
      <div class="player-author" id="author"></div>
      <div class="player-tags" id="tags"></div>
      <div class="player-extra" id="extra"></div>
      <div class="player-err" id="err"></div>
    </div>
  </div>
  <div class="player-sidebar">
    <div class="sidebar-header">
      <span>播放列表</span>
      <span class="count" id="listCount"></span>
    </div>
    <div class="sidebar-list" id="playlist">
      <div class="sidebar-empty">加载中…</div>
    </div>
    <div class="loading-more" id="loadingMore" style="display:none">加载更多</div>
  </div>
</div>

<script src="/vendor/artplayer.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const id = (q.get("id") || "").trim();
  const $ = (s) => document.querySelector(s);
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function dur(n) {
    n = Number(n) || 0;
    return Math.floor(n / 60) + ":" + String(Math.floor(n % 60)).padStart(2, "0");
  }
  function themeColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--primary").trim() || "#2563eb";
  }
  function applyThemeBtn() {
    const night = document.documentElement.getAttribute("data-theme") === "night";
    const btn = $("#themeBtn");
    if (btn) btn.textContent = night ? "☀ 白天" : "🌙 夜间";
  }
  applyThemeBtn();
  const themeBtn = $("#themeBtn");
  if (themeBtn) {
    themeBtn.onclick = function () {
      const night = document.documentElement.getAttribute("data-theme") === "night";
      const next = night ? "day" : "night";
      if (next === "night") document.documentElement.setAttribute("data-theme", "night");
      else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem("gbmd-theme", next); } catch (_) {}
      applyThemeBtn();
      if (window.__art) window.__art.theme = themeColor();
    };
  }

  if (!id) { $("#title").textContent = "缺少视频 id"; return; }

  const PAGE_SIZE = 20;
  let art = null;
  let allVideos = [];
  let displayedCount = 0;

  // 用户原话：「没下载完的part文件我希望也能部分播放」
  // AI 思路：.part 已写入字节就能播；ArtPlayer 按 Content-Length 当完整文件，
  // 所以服务端把 total 报成已写入大小。播放中 seek 超出当前时长就夹回去。
  function initPlayer(info, poster) {
    if (!info.hasFile) {
      $("#err").textContent = info.partial
        ? "正在下载中，已写入 0 字节，等几秒再刷新"
        : "没有可播放的视频文件";
      return;
    }
    if (art) {
      try { art.destroy(false); } catch (_) {}
      art = null;
    }
    art = new Artplayer({
      container: "#player",
      url: "/api/play?id=" + encodeURIComponent(id),
      poster: poster || "",
      theme: themeColor(),
      lang: "zh-cn",
      volume: 0.7,
      autoplay: true,
      playbackRate: true,
      aspectRatio: true,
      screenshot: true,
      setting: true,
      hotkey: true,
      pip: true,
      fullscreen: true,
      fullscreenWeb: true,
      miniProgressBar: true,
      playsInline: true,
      mutex: true,
      moreVideoAttr: { playsInline: true }
    });
    window.__art = art;
    try {
      if (art.video) {
        art.video.removeAttribute("crossorigin");
        art.video.crossOrigin = null;
      }
    } catch (_) {}
    art.on("error", function (err) {
      $("#err").textContent = (err && err.message) || "播放失败";
    });
    if (info.partial) {
      $("#err").textContent = "边下边播：进度条只到已写入部分，拖到后面会回到已缓存处。下完刷新看全片。";
      art.on("video:seeking", function () {
        const v = art.video;
        if (!v || !isFinite(v.duration) || v.duration <= 0) return;
        if (v.currentTime > v.duration - 0.25) v.currentTime = Math.max(0, v.duration - 0.5);
      });
    }
  }

  function catalogVideos(j) {
    const map = (j && j.videos && typeof j.videos === "object") ? j.videos : {};
    return Object.keys(map).map(function (vid) {
      const e = map[vid] || {};
      return {
        id: vid,
        title: e.title || vid,
        name: e.name || e.username || "",
        duration: e.duration || 0,
        fileId: e.fileId || "",
        createdAt: e.createdAt || ""
      };
    }).sort(function (a, b) {
      return String(b.createdAt).localeCompare(String(a.createdAt));
    });
  }

  function renderPlaylist(clear) {
    const container = $("#playlist");
    const countEl = $("#listCount");
    const loadingEl = $("#loadingMore");
    if (clear) {
      container.innerHTML = "";
      displayedCount = 0;
    }
    if (!allVideos.length) {
      container.innerHTML = '<div class="sidebar-empty">索引里还没有其它视频</div>';
      countEl.textContent = "";
      loadingEl.style.display = "none";
      return;
    }
    const start = displayedCount;
    const end = Math.min(start + PAGE_SIZE, allVideos.length);
    for (let i = start; i < end; i++) {
      const v = allVideos[i];
      const item = document.createElement("div");
      item.className = "playlist-item" + (v.id === id ? " active" : "");
      const thumbSrc = v.fileId
        ? "/api/thumb?file=" + encodeURIComponent(v.fileId) + "&n=0"
        : "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 45%22%3E%3Crect fill=%22%23333%22 width=%2280%22 height=%2245%22/%3E%3Ctext x=%2240%22 y=%2226%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22%3E▶%3C/text%3E%3C/svg%3E";
      item.innerHTML =
        '<img class="thumb" src="' + esc(thumbSrc) + '" alt="" loading="lazy">' +
        '<div class="info">' +
          '<div class="title" title="' + esc(v.title) + '">' + esc(v.title) + "</div>" +
          '<div class="meta">' + esc(v.name) + (v.duration ? " · " + dur(v.duration) : "") + "</div>" +
        "</div>";
      item.onclick = (function (vid) {
        return function () {
          if (vid === id) return;
          location.href = "/play.html?id=" + encodeURIComponent(vid);
        };
      })(v.id);
      container.appendChild(item);
    }
    displayedCount = end;
    countEl.textContent = allVideos.length + " 个";
    if (end < allVideos.length) {
      loadingEl.style.display = "block";
      loadingEl.textContent = "加载更多（还剩 " + (allVideos.length - end) + "）";
    } else {
      loadingEl.style.display = "none";
    }
  }

  function bindLazyLoad() {
    const list = $("#playlist");
    const more = $("#loadingMore");
    more.onclick = function () { renderPlaylist(false); };
    list.addEventListener("scroll", function () {
      if (displayedCount >= allVideos.length) return;
      if (list.scrollTop + list.clientHeight >= list.scrollHeight - 40) renderPlaylist(false);
    });
  }

  fetch("/api/play-info?id=" + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j) return;
      if (!j.ok) throw new Error(j.error || "读取失败");
      document.title = (j.title || id) + " · 本地播放";
      $("#title").textContent = j.title || id;
      const name = j.name || j.username || "";
      $("#author").innerHTML = name
        ? (j.username
          ? '<a href="https://www.iwara.tv/profile/' + encodeURIComponent(j.username) + '" target="_blank" rel="noopener">' + esc(name) + "</a>"
          : esc(name))
        : "";
      const tags = Array.isArray(j.tags) ? j.tags : [];
      $("#tags").innerHTML = tags.map(function (t) { return "<span>" + esc(t.id || t) + "</span>"; }).join("");
      const extra = [];
      if (j.duration) extra.push("时长 " + dur(j.duration));
      if (j.createdAt) extra.push("上传 " + String(j.createdAt).slice(0, 10));
      extra.push("id " + id);
      $("#extra").textContent = extra.join(" · ");
      const poster = j.fileId ? "/api/thumb?file=" + encodeURIComponent(j.fileId) + "&n=0" : "";
      initPlayer(j, poster);
    })
    .catch(function (e) {
      $("#title").textContent = "无法播放";
      $("#err").textContent = e.message || String(e);
    });

  fetch("/api/index")
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) return;
      allVideos = catalogVideos(j);
      renderPlaylist(true);
      bindLazyLoad();
    })
    .catch(function () {
      $("#playlist").innerHTML = '<div class="sidebar-empty">播放列表加载失败</div>';
    });

  window.addEventListener("beforeunload", function () {
    if (art) { try { art.destroy(false); } catch (_) {} }
  });
})();
</script>
</body>
</html>
